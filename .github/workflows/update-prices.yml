name: Atualizar preços de passagens

on:
  schedule:
    # Toda segunda-feira às 8h BRT (11h UTC)
    - cron: '0 11 * * 1'
  # Permite rodar manualmente pelo GitHub → Actions → Run workflow
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Buscar preços via Amadeus API
        run: node scripts/update-prices.mjs
        env:
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          AMADEUS_ENV: production

      - name: Commit se houver alterações
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git diff --quiet config/flight-prices.json || (
            git add config/flight-prices.json &&
            git commit -m "chore: atualizar preços de passagens ($(date +%Y-%m-%d))"
          )

      - name: Push
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
